allowBuilds:
  '@phc/format': true
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - '@orkoruta/*'
onlyBuiltDependencies:
  - '@phc/format'
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - esbuild
  - prisma
