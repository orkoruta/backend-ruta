services:
  - type: web
    name: ruta-api
    runtime: node
    repo: https://github.com/orkoruta/backend-ruta
    rootDir: .
    buildCommand: >-
      npm install pnpm@11.4.0 --no-save &&
      node_modules/.bin/pnpm install --frozen-lockfile &&
      node_modules/.bin/pnpm --filter @ruta/api build
    startCommand: pnpm --filter @ruta/api start
    healthCheckPath: /healthz
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LOGTAIL_TOKEN
        sync: false
      - key: NPM_TOKEN
        sync: false

  - type: worker
    name: ruta-api-worker
    runtime: node
    repo: https://github.com/orkoruta/backend-ruta
    rootDir: .
    buildCommand: >-
      npm install pnpm@11.4.0 --no-save &&
      node_modules/.bin/pnpm install --frozen-lockfile &&
      node_modules/.bin/pnpm --filter @ruta/api build
    startCommand: pnpm --filter @ruta/api start:worker
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: LOGTAIL_TOKEN
        sync: false
      - key: NPM_TOKEN
        sync: false
